<div class="auth-body">
  <div class="auth-container">
    <h3 class="text-center mb-3">Register</h3>

    <input type="text" [(ngModel)]="user.name" placeholder="Name" class="form-control mb-2" />
    <input type="email" [(ngModel)]="user.email" placeholder="Email" class="form-control mb-2" />
    <input type="password" [(ngModel)]="user.password" placeholder="Password" class="form-control mb-2" />

    <button class="btn btn-success w-100" (click)="register()">Register</button>

    <p class="text-center mt-2">{{ message }}</p>
    <p class="text-center mt-2">
      Already have an account? <a routerLink="/login">Login</a>
    </p>
  </div>
</div>
